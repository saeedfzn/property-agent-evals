name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The live provider is never used in CI: no key, no network calls, no cost.
      MODEL_PROVIDER: fixture
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: TypeScript tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Python grader tests
        run: python -m unittest discover -s evals/tests -v

      - name: Eval (fixture provider) + threshold gate + regression check vs committed baseline
        run: npm run eval

      - name: Prove the gate bites (v1 prompt must be rejected)
        run: |
          if python evals/harness/gate.py --report evals/reports/v1.json; then
            echo "::error::gate accepted the v1 report, which hallucinates"; exit 1
          fi

      - name: Eval report to job summary
        if: always()
        run: |
          if [ -f evals/runs/v2/report.md ]; then cat evals/runs/v2/report.md >> "$GITHUB_STEP_SUMMARY"; fi
